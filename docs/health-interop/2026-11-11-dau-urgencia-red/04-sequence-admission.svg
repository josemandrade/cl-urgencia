<text x="54" y="620" font-family="sans-serif" font-size="12.5" fill="#451a03">C1 (vía rápida): la admisión administrativa corre en paralelo con la atención clínica (puerta AND del BPMN); el aviso se publica cuando el episodio existe en el HIS.</text>
<rect x="40" y="644" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="666" font-family="sans-serif" font-size="12.5" fill="#451a03">400–422: el HIS corrige y reenvía. 412: identificador condicional ambiguo. 422: la identidad no se resolvió en el MPI; el HIS corrige y reenvía. Sin respuesta, se</text>
<text x="54" y="684" font-family="sans-serif" font-size="12.5" fill="#451a03">puede reenviar la misma transacción (las operaciones condicionales evitan duplicados).</text>
<rect x="40" y="708" width="1200" height="38" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="730" font-family="sans-serif" font-size="12.5" fill="#451a03">Nunca se envía la admisión de un episodio ya cerrado: el PUT lo reabriría.</text>
<text x="640" y="780" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de 04-sequence-diagrams.md.</text>
