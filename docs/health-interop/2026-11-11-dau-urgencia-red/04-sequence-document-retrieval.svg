<text x="54" y="476" font-family="sans-serif" font-size="12.5" fill="#451a03">El PDF se descarga con un GET autenticado directo a DocumentReference.content.attachment.url; no es una transacción ITI-68.</text>
<text x="54" y="494" font-family="sans-serif" font-size="12.5" fill="#451a03">Si el HIS no está disponible, el PDF no se puede descargar: el Repositorio guarda la referencia, no el documento.</text>
<text x="490" y="544" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de 04-sequence-diagrams.md.</text>
