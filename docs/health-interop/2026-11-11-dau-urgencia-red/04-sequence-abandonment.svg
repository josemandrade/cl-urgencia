<text x="54" y="742" font-family="sans-serif" font-size="12.5" fill="#451a03">NEA: el paciente nunca fue atendido — sin hipótesis ni medicamentos; el PDF puede no existir. Fuga: hipótesis provisional (sin use) y nota de urgencia (LOINC</text>
<text x="54" y="760" font-family="sans-serif" font-size="12.5" fill="#451a03">34111-5).</text>
<rect x="40" y="784" width="1200" height="38" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="806" font-family="sans-serif" font-size="12.5" fill="#451a03">El aviso de abandono repite todos los datos de la admisión: el PUT reemplaza el Encounter completo; un dato omitido se borra del repositorio.</text>
<text x="640" y="856" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de 04-sequence-diagrams.md.</text>
