<text x="54" y="1010" font-family="sans-serif" font-size="12.5" fill="#451a03">Buscar episodios también por establecimiento: GET /Encounter?service-provider.identifier=&lt;sistema</text>
<text x="54" y="1028" font-family="sans-serif" font-size="12.5" fill="#451a03">DEIS&gt;|&lt;código&gt;&amp;class=EMER&amp;status=arrived.</text>
<rect x="40" y="1052" width="960" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1074" font-family="sans-serif" font-size="12.5" fill="#451a03">DSUB no encaja: la suscripción es una Subscription FHIR sobre Encounter class=EMER, no una suscripción DSUB a metadatos de un</text>
<text x="54" y="1092" font-family="sans-serif" font-size="12.5" fill="#451a03">registro XDS. El canal de notificación (por ejemplo, REST-hook) es un detalle de implementación.</text>
<text x="520" y="1142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de 04-sequence-diagrams.md.</text>
